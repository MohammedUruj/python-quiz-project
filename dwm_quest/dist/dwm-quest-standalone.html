<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>DWM Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="DWM QUEST: The Daily Excellence Challenge, an interactive Daily Work Management learning game and assessment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a control-room shell — navy top bar, one working column, boards drawn like shop-floor display panels. */
:root {
  --bg: #eef1f5;          /* steel-tinted paper */
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --line: #d3d9e2;
  --fg: #142033;
  --muted: #56647a;
  --navy: #13284a;        /* brand primary */
  --navy-fg: #ffffff;
  --steel: #6f7d92;
  --accent: #c98a12;      /* restrained safety amber */
  --accent-soft: #fbf1dc;
  --ok: #1f7a4d;  --ok-soft: #e3f3ea;
  --warn: #a8640a; --warn-soft: #fcefd9;
  --bad: #b3261e; --bad-soft: #fbe5e3;
  --info: #1d5fa8; --info-soft: #e3eefb;
  --board: #0f1d33;       /* DWM board face */
  --board-fg: #e8eef7;
  --board-line: #2a3d5c;
  --focus: #2f7de1;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 6px;
  --shadow: 0 1px 2px rgba(16, 32, 60, .08), 0 4px 14px rgba(16, 32, 60, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1424; --surface: #12203a; --surface-2: #172846; --line: #29395a;
    --fg: #e6ecf5; --muted: #9eadc4; --navy: #0a1730; --navy-fg: #f2f5fa; --steel: #8d9bb2;
    --accent: #e3a73a; --accent-soft: #3a2c10;
    --ok: #5cc28f; --ok-soft: #12321f; --warn: #e3a73a; --warn-soft: #382a10;
    --bad: #f07d74; --bad-soft: #3d1715; --info: #7db2f0; --info-soft: #132c4d;
    --board: #08111f; --board-fg: #e8eef7; --board-line: #2a3d5c; --focus: #7db2f0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1424; --surface: #12203a; --surface-2: #172846; --line: #29395a;
  --fg: #e6ecf5; --muted: #9eadc4; --navy: #0a1730; --navy-fg: #f2f5fa; --steel: #8d9bb2;
  --accent: #e3a73a; --accent-soft: #3a2c10;
  --ok: #5cc28f; --ok-soft: #12321f; --warn: #e3a73a; --warn-soft: #382a10;
  --bad: #f07d74; --bad-soft: #3d1715; --info: #7db2f0; --info-soft: #132c4d;
  --board: #08111f; --board-fg: #e8eef7; --board-line: #2a3d5c; --focus: #7db2f0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); }
h2 { font-size: 1.75rem; }
h3 { font-size: 1.25rem; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus, main:focus { outline: none; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .09em; font-size: .8rem; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: var(--navy-fg); }
.topbar-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--font-display); font-size: 1.35rem; letter-spacing: .04em; }
.brand span { font-size: .78rem; opacity: .75; }
.topbar .spacer { flex: 1; }
.save-pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,.1); white-space: nowrap; }
.save-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #9fb0c8; }
.save-pill[data-state="saved"] .dot { background: #5cc28f; }
.save-pill[data-state="saving"] .dot { background: #e3a73a; animation: pulse 1s infinite; }
.save-pill[data-state="offline"] .dot { background: #e3a73a; }
.save-pill[data-state="error"] .dot { background: #f07d74; }
.save-pill button { background: #fff; color: #13284a; border: 0; border-radius: 99px; padding: 0 8px; cursor: pointer; font-size: .75rem; }
@keyframes pulse { 50% { opacity: .35; } }
.tb-btn { background: transparent; border: 1px solid rgba(255,255,255,.35); color: var(--navy-fg); border-radius: var(--r); padding: 4px 10px; cursor: pointer; font-size: .85rem; }
.tb-btn:hover { background: rgba(255,255,255,.12); }

.mode-banner { background: var(--warn-soft); color: var(--fg); border-bottom: 1px solid var(--line); font-size: .85rem; }
.mode-banner > div { max-width: 1100px; margin: 0 auto; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mode-banner.central { background: var(--info-soft); }

main#app { max-width: 1100px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel.flat { box-shadow: none; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--surface); padding: 9px 16px; cursor: pointer; font-weight: 500; min-height: 42px; text-align: left; }
.btn:hover { border-color: var(--steel); }
.btn.primary { background: var(--navy); color: var(--navy-fg); border-color: var(--navy); }
:root[data-theme="dark"] .btn.primary { background: var(--info); color: #0b1424; border-color: var(--info); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: var(--info); color: #0b1424; border-color: var(--info); } }
.btn.primary:hover { filter: brightness(1.12); }
.btn.accent { background: var(--accent); color: #1a1205; border-color: var(--accent); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: .85rem; }

/* ---------- welcome ---------- */
.hero { background: var(--navy); color: var(--navy-fg); border-radius: var(--r); overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
.hero-copy { padding: 32px; display: flex; flex-direction: column; gap: 14px; }
.hero-copy .label { color: #c2cee0; }
.hero-copy .tagline { font-family: var(--font-display); font-size: 1.2rem; letter-spacing: .02em; color: #f2d48a; line-height: 1.35; }
.hero-art { background: #0c1a31; min-height: 220px; position: relative; }
.hero-art { display: flex; align-items: center; }
.hero-art canvas { width: 100%; height: auto; max-width: 100%; display: block; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .hero-copy { padding: 22px; } }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.flow > div { border-top: 4px solid var(--steel); background: var(--surface); border-radius: 0 0 var(--r) var(--r); padding: 12px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.flow > div:nth-child(1) { border-top-color: var(--info); }
.flow > div:nth-child(2) { border-top-color: var(--ok); }
.flow > div:nth-child(3) { border-top-color: var(--accent); }
.flow > div:nth-child(4) { border-top-color: var(--bad); }
.flow h3 { font-size: 1.1rem; margin-bottom: 4px; }
.flow ul { margin: 0; padding-left: 18px; font-size: .86rem; color: var(--muted); }
@media (max-width: 760px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 4px; }
.field input, .field select { border: 1px solid var(--line); border-radius: var(--r); padding: 9px 11px; background: var(--surface); min-height: 42px; }
.field .err { color: var(--bad); font-size: .82rem; min-height: 1em; }
select { border: 1px solid var(--line); border-radius: var(--r); padding: 7px 9px; background: var(--surface); max-width: 100%; }

/* ---------- hub ---------- */
.progress { height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--ok); }
.missions { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.mcard .num { font-family: var(--font-display); font-size: 2.2rem; color: var(--steel); line-height: 1; }
.mcard header { display: flex; gap: 12px; align-items: flex-start; }
.mcard .phase { font-size: .72rem; }
.mcard p { color: var(--muted); font-size: .9rem; flex: 1; }
.mcard[data-status="locked"] { opacity: .62; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.info { background: var(--info-soft); color: var(--info); border-color: transparent; }

/* ---------- mission ---------- */
.mission-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.steps i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.steps i.done { background: var(--ok); }
.steps i.cur { background: var(--accent); }
.dialogue { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.dialogue .who { font-weight: 600; }
.dialogue .role { font-size: .8rem; color: var(--muted); }
.dialogue .say { margin-top: 4px; max-width: 70ch; }
.portrait { width: 64px; height: 64px; flex: none; border-radius: 50%; overflow: hidden; background: var(--surface-2); }
.portrait svg { width: 100%; height: 100%; display: block; }
@media (prefers-reduced-motion: no-preference) { .dialogue { animation: rise .35s ease-out; } }
@keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }

.prompt { font-weight: 600; font-size: 1.05rem; max-width: 75ch; }
.options { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; border: 1px solid var(--line); border-radius: var(--r); padding: 11px 13px; background: var(--surface); cursor: pointer; }
.opt:hover { border-color: var(--steel); }
.opt[aria-pressed="true"], .opt[aria-checked="true"] { border-color: var(--info); background: var(--info-soft); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .key { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); min-width: 1.4em; padding-top: 2px; }
.feedback { border-left: 4px solid var(--steel); background: var(--surface-2); padding: 12px 14px; border-radius: 0 var(--r) var(--r) 0; max-width: 80ch; }
.feedback.ok { border-left-color: var(--ok); background: var(--ok-soft); }
.feedback.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.feedback.note { border-left-color: var(--accent); background: var(--accent-soft); }
.feedback b { display: block; margin-bottom: 2px; }
.hint { font-size: .9rem; }
details.hint summary { cursor: pointer; color: var(--info); }

.classify { display: flex; flex-direction: column; gap: 8px; }
.citem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--surface); }
.citem.correct { border-color: var(--ok); }
.citem.wrong { border-color: var(--bad); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 4px; padding: 5px 9px; cursor: pointer; font-size: .82rem; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--navy-fg); border-color: var(--navy); }
@media (max-width: 640px) { .citem { grid-template-columns: 1fr; } .seg { justify-content: flex-start; } }

.seq { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.seq ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; counter-reset: s; }
.seq ol li { counter-increment: s; display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; background: var(--surface); }
.seq ol li::before { content: counter(s); font-family: var(--font-mono); color: var(--muted); min-width: 1.3em; }
.seq ol li.correct { border-color: var(--ok); }
.seq ol li.wrong { border-color: var(--bad); }
.seq ol li span { flex: 1; }
.seq .pool { display: flex; flex-direction: column; gap: 6px; }
.slot-empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 8px 10px; color: var(--muted); font-size: .88rem; }

.chain { display: flex; flex-direction: column; gap: 0; }
.chain .link { display: flex; align-items: center; gap: 10px; }
.chain .arrow { margin-left: 22px; height: 16px; border-left: 2px solid var(--steel); }

/* ---------- data tables & boards ---------- */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: .78rem; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
tr:last-child td { border-bottom: 0; }
tr.flag td { background: var(--bad-soft); }

.board { background: var(--board); color: var(--board-fg); border-radius: var(--r); padding: 14px; border: 6px solid #3a475c; }
.board-title { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; border-bottom: 1px solid var(--board-line); padding-bottom: 8px; margin-bottom: 12px; }
.board-title b { font-family: var(--font-display); font-size: 1.4rem; letter-spacing: .06em; }
.sim { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .1em; border: 1px solid #e3a73a; color: #f2c46b; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.hotspots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 820px) { .hotspots { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.hs { position: relative; text-align: left; background: #14243f; color: var(--board-fg); border: 1px solid var(--board-line); border-radius: 5px; padding: 10px; cursor: pointer; min-height: 92px; display: flex; flex-direction: column; gap: 4px; }
.hs:hover { border-color: #7db2f0; }
.hs .tag { font-family: var(--font-mono); font-size: .72rem; color: #9fb4d4; }
.hs .t { font-family: var(--font-display); font-size: 1.02rem; letter-spacing: .03em; }
.hs .v { font-family: var(--font-mono); font-size: .82rem; color: #c8d5ea; }
.hs.seen::after { content: "✓ reviewed"; position: absolute; top: 8px; right: 8px; font-size: .68rem; color: #5cc28f; font-family: var(--font-mono); }
.hs.alert { border-color: #f07d74; }
.hs.alert .v { color: #ffb1aa; }
.hs.req { box-shadow: 0 0 0 2px #e3a73a; }
@media (prefers-reduced-motion: no-preference) { .hs.req { animation: glow 1.6s ease-in-out infinite; } }
@keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(227, 167, 58, .35); } }
.board-detail { margin-top: 12px; background: #0b172b; border: 1px solid var(--board-line); border-radius: 5px; padding: 12px; }
.board-detail table { color: var(--board-fg); }
.board-detail th { background: #12223c; color: #9fb4d4; }
.board-detail th, .board-detail td { border-bottom-color: var(--board-line); }
.board-detail tr.flag td { background: #3d1715; }
.board-detail .tablewrap { background: transparent; border-color: var(--board-line); }
.bad-t { color: #ffb1aa; }
.ok-t { color: #8fe0b4; }
.bars { display: flex; flex-direction: column; gap: 6px; }

.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: .88rem; }
.checklist li { display: flex; gap: 8px; align-items: baseline; }
.checklist li::before { content: "○"; color: var(--muted); }
.checklist li.done::before { content: "●"; color: var(--ok); }
.checklist li.cur { font-weight: 600; }
.checklist li.cur::before { content: "▶"; color: var(--accent); }

/* ---------- factory scene ---------- */
.scene-wrap { position: relative; background: #1b2638; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.scene-wrap canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: pointer; }
.scene-hud { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 10px; background: #111b2b; }
.scene-tip { background: rgba(8, 17, 31, .82); color: #e8eef7; padding: 6px 10px; border-radius: 5px; font-size: .85rem; max-width: 60ch; }
.dpad { display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(2, 40px); gap: 4px; }
.dpad button { background: rgba(8, 17, 31, .8); color: #fff; border: 1px solid #415372; border-radius: 6px; cursor: pointer; }

/* ---------- assessment ---------- */
.qnav { display: flex; gap: 4px; flex-wrap: wrap; }
.qnav button { width: 34px; height: 34px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--font-mono); font-size: .82rem; }
.qnav button.answered { background: var(--info-soft); border-color: var(--info); }
.qnav button.cur { outline: 2px solid var(--accent); }
.scoreband { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
.bignum { font-family: var(--font-display); font-size: 4rem; line-height: 1; }
.verdict { font-family: var(--font-display); font-size: 1.6rem; }

/* ---------- admin ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.kpi b { display: block; font-family: var(--font-display); font-size: 2rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; align-items: end; }
.filters .field input, .filters .field select { min-height: 36px; padding: 6px 8px; }
table.results tbody tr { cursor: pointer; }
table.results tbody tr:hover td { background: var(--surface-2); }

/* ---------- toast / modal ---------- */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: var(--r); z-index: 50; max-width: calc(100% - 32px); font-size: .9rem; }

.modal { background: var(--surface); border-radius: var(--r); max-width: 520px; width: 100%; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow: auto; }

.footer-note { font-size: .78rem; color: var(--muted); margin-top: 28px; border-top: 1px solid var(--line); padding-top: 12px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.station-grid { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .station-grid { grid-template-columns: 1fr; } }

// Pure logic: hashing, scoring, eligibility, progress and CSV. No DOM access, so tests can load it in Node.
(function (root) {

  // cyrb53: small non-cryptographic hash. Answer keys are stored as hashes so they are not readable
  // in the page source. This deters casual inspection only; see README "Assessment integrity".
  function hash(str, seed = 0) {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  const answerKey = (salt, qid, optionId) => hash(`${salt}|${qid}|${optionId}`, 7);

  function newState() {
    const missions = {};
    MISSION_IDS.forEach((id, i) => {
      missions[id] = { status: i === 0 ? "available" : "locked", step: 0, answers: {}, tries: {}, points: 0, completedAt: null };
    });
    return { schemaVersion: SCHEMA_VERSION, missions, checkpoint: { screen: "hub", label: "Mission Hub" }, assessment: null };
  }

  // Forward-compatible merge: missions added in later versions appear without breaking saved progress.
  function migrateState(saved) {
    const base = newState();
    if (!saved || typeof saved !== "object") return base;
    const out = { ...base, ...saved, missions: { ...base.missions } };
    MISSION_IDS.forEach((id) => {
      if (saved.missions && saved.missions[id]) out.missions[id] = { ...base.missions[id], ...saved.missions[id] };
    });
    unlockMissions(out);
    out.schemaVersion = SCHEMA_VERSION;
    return out;
  }

  function unlockMissions(state) {
    MISSION_IDS.forEach((id, i) => {
      const m = state.missions[id];
      if (m.status === "locked" && (i === 0 || state.missions[MISSION_IDS[i - 1]].status === "completed")) m.status = "available";
    });
    return state;
  }

  const missionsCompleted = (state) => MISSION_IDS.filter((id) => state.missions[id].status === "completed");
  const allMissionsDone = (state) => missionsCompleted(state).length === MISSION_IDS.length;
  const totalPoints = (state) => MISSION_IDS.reduce((s, id) => s + (state.missions[id].points || 0), 0);

  // Progress: six missions + one submitted assessment = seven mandatory activities.
  function progressPct(state, attemptsCount) {
    const done = missionsCompleted(state).length + (attemptsCount > 0 ? 1 : 0);
    return Math.round((done / (MISSION_IDS.length + 1)) * 100);
  }

  function currentMission(state) {
    if (allMissionsDone(state)) return "Assessment";
    const m = MISSION_IDS.find((id) => state.missions[id].status !== "completed");
    return m ? "Mission " + m.slice(1) : "Assessment";
  }

  // questions: [{id, area, key, options:[{id}]}]; answers: {qid: optionId}
  function scoreAttempt(questions, answers, salt) {
    let correct = 0;
    const wrongAreas = new Set();
    const perQuestion = questions.map((q) => {
      const chosen = answers[q.id];
      const ok = chosen != null && answerKey(salt, q.id, chosen) === q.key;
      if (ok) correct++; else wrongAreas.add(q.area);
      return { id: q.id, chosen: chosen ?? null, correct: ok };
    });
    const total = questions.length;
    const scorePct = total ? Math.round((correct / total) * 1000) / 10 : 0;
    return { correct, incorrect: total - correct, total, scorePct, perQuestion, wrongAreas: [...wrongAreas] };
  }

  function isPass(scorePct, passPercent) { return scorePct + 1e-9 >= passPercent; }

  function eligibility({ scorePct, passPercent, missionsDone, requireAllMissions }) {
    const passed = scorePct != null && isPass(scorePct, passPercent);
    const eligible = passed && (!requireAllMissions || missionsDone);
    return { passed, eligible };
  }

  function attemptsAllowed(maxAttempts, used) { return !maxAttempts || used < maxAttempts; }

  function validEmail(email, domains) {
    const e = String(email || "").trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)) return false;
    if (domains && domains.length) return domains.includes(e.split("@")[1]);
    return true;
  }
  const validEmployeeId = (id) => /^[A-Za-z0-9][A-Za-z0-9\-_/]{1,19}$/.test(String(id || "").trim());
  const validName = (n) => { const s = String(n || "").trim(); return s.length >= 2 && s.length <= 80; };

  function csvCell(v) {
    if (v == null) return "";
    let s = String(v);
    // Neutralise spreadsheet formula injection from user-entered text.
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(headers, rows) {
    // BOM so Excel opens UTF-8 correctly.
    return "﻿" + [headers, ...rows].map((r) => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
  }

  function shuffle(arr, rnd = Math.random) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function newId(prefix) {
    const r = (root.crypto && root.crypto.getRandomValues) ? Array.from(root.crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, "0")).join("") : Math.random().toString(16).slice(2, 18);
    return `${prefix}-${Date.now().toString(36)}-${r}`;
  }

  DWM.logic = { MISSION_IDS, SCHEMA_VERSION, hash, answerKey, newState, migrateState, unlockMissions, missionsCompleted,
    allMissionsDone, totalPoints, progressPct, currentMission, scoreAttempt, isPass, eligibility, attemptsAllowed,
    validEmail, validEmployeeId, validName, csvCell, toCSV, shuffle, newId };
})(typeof window !== "undefined" ? window : globalThis);

// Small DOM helpers, character portraits, dialogue, toasts and confirmation dialogs.
(function () {
  const DWM = window.DWM;

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "text") e.textContent = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
    return e;
  }

  // Simple, professional bust portraits drawn as SVG (no external art).
  function portrait(key) {
    const c = DWM.CHARACTERS[key];
    const hat = c.hat ? `<path d="M18 30 Q32 12 46 30 Z" fill="${c.hat}"/><rect x="15" y="28" width="34" height="4" rx="2" fill="${c.hat}"/>` :
      `<path d="M19 31 Q20 15 32 15 Q45 15 45 31 Q42 22 32 22 Q23 22 19 31Z" fill="${c.hair}"/>`;
    return `<svg viewBox="0 0 64 64" role="img" aria-label="${c.name}, ${c.role}">
      <rect width="64" height="64" fill="${c.color}" opacity=".18"/>
      <path d="M10 64 Q12 45 32 44 Q52 45 54 64Z" fill="${c.color}"/>
      <rect x="27" y="38" width="10" height="8" fill="${c.skin}"/>
      <ellipse cx="32" cy="31" rx="12" ry="13" fill="${c.skin}"/>
      ${hat}
      <circle cx="27.5" cy="32" r="1.4" fill="#1b1b1b"/><circle cx="36.5" cy="32" r="1.4" fill="#1b1b1b"/>
      <path d="M28 37.5 Q32 40 36 37.5" stroke="#5a2e1e" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <rect x="40" y="50" width="9" height="5" rx="1" fill="#fff" opacity=".9"/>
    </svg>`;
  }

  function dialogue(key, text) {
    const c = DWM.CHARACTERS[key];
    return h("div", { class: "dialogue", role: "group", "aria-label": `${c.name} says` },
      h("div", { class: "portrait", html: portrait(key) }),
      h("div", { style: "min-width:0" }, h("div", null, h("span", { class: "who", text: c.name }), " ", h("span", { class: "role", text: "· " + c.role })), h("p", { class: "say", text })));
  }

  let toastTimer;
  function toast(msg) {
    let t = document.querySelector(".toast");
    if (!t) { t = h("div", { class: "toast", role: "status" }); document.body.append(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200);
  }

  // In-page confirmation (the artifact frame has no window.confirm).
  function confirmBox({ title, body, ok = "Confirm", cancel = "Cancel" }) {
    return new Promise((resolve) => {
      const back = h("div", { class: "modal-back" });
      const done = (v) => { back.remove(); resolve(v); };
      const okBtn = h("button", { class: "btn primary", onclick: () => done(true) }, ok);
      back.append(h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title },
        h("h3", { text: title }), typeof body === "string" ? h("p", { text: body }) : body,
        h("div", { class: "row", style: "justify-content:flex-end" }, h("button", { class: "btn", onclick: () => done(false) }, cancel), okBtn)));
      back.addEventListener("keydown", (e) => { if (e.key === "Escape") done(false); });
      document.body.append(back); okBtn.focus();
    });
  }

  const fmtOpts = () => ({ timeZone: DWM.CONFIG.displayTimeZone, dateStyle: "medium", timeStyle: "short" });
  function fmtDate(iso) { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleString(undefined, fmtOpts()); }
  function fmtDur(sec) { sec = Math.round(sec || 0); const m = Math.floor(sec / 60); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; }

  function focusMain() { const m = document.getElementById("app"); const f = m.querySelector("h1, h2"); if (f) { f.setAttribute("tabindex", "-1"); f.focus({ preventScroll: true }); } window.scrollTo({ top: 0 }); }

  DWM.ui = { h, portrait, dialogue, toast, confirmBox, fmtDate, fmtDur, focusMain };
})();

// Persistence layer.
//  - CENTRAL mode: claude.ai Artifact database. Identity comes from the viewer's claude.ai sign-in.
//    Access is enforced server-side by the db rules declared at publish (see README "Security model"):
//      participants/<uid>/...  each signed-in participant reads/writes only their own subtree
//      participants (all)      readable only by the artifact owner
//      audit/...               owner only
//  - DEMO mode: this browser's localStorage only. Not for real employee records.
(function () {
  const DWM = window.DWM;
  const L = DWM.logic;
  const listeners = new Set();
  let status = { state: "idle", text: "Not saved yet" };
  const S = { mode: "pending", uid: null, isOwner: false, db: null, user: null, canWrite: null };

  function setStatus(state, text) { status = { state, text }; listeners.forEach((f) => f(status)); }
  const STATUS_TEXT = { saving: "Saving…", saved: "Progress saved", offline: "Offline — changes pending", error: "Unable to save — retry required" };

  const ls = {
    get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
    set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }, // throws if storage is blocked; callers handle it
  };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const transient = (e) => !e || !e.code || ["unavailable", "resource_exhausted"].includes(e.code) || (typeof navigator !== "undefined" && navigator.onLine === false);

  async function withTimeout(p, ms) { return Promise.race([p, sleep(ms).then(() => null)]); }

  async function init() {
    const c = window.claude;
    if (c && typeof c.use === "function") {
      const [db, user] = await Promise.all([withTimeout(c.use("db"), 10000), withTimeout(c.use("user"), 10000)]);
      const uid = user ? await user.id() : null;
      if (db && uid) {
        S.mode = "central"; S.db = db; S.user = user; S.uid = uid;
        S.isOwner = await user.isOwner();
        try { S.canWrite = await user.can("data.write"); } catch { S.canWrite = null; }
        return S;
      }
      S.reason = !db ? "The results store is not available in this view." : "You are not signed in to claude.ai, so your progress can't be saved centrally.";
    } else {
      S.reason = "This copy is running outside claude.ai, so there is no central results store.";
    }
    S.mode = "demo"; S.uid = "demo-local"; S.isOwner = false;
    return S;
  }

  // ---------------- participant profile ----------------
  const profileRef = () => S.db.doc("participants/" + S.uid);

  async function loadProfile() {
    if (S.mode === "central") {
      let lastErr;
      for (let i = 0; i < 3; i++) {
        try {
          const snap = await profileRef().get();
          return snap.exists ? clone(snap.data()) : null;
        } catch (e) { lastErr = e; if (!transient(e)) break; await sleep(800 * (i + 1) + Math.random() * 400); }
      }
      throw lastErr || new Error("load failed");
    }
    return ls.get("dwmq.demo.profile");
  }

  let pending = null, inflight = false, retryTimer = null, backoff = 2000;
  function saveProfile(profile) {
    pending = clone(profile);
    kick();
  }
  async function kick() {
    if (inflight || !pending) return;
    clearTimeout(retryTimer);
    if (typeof navigator !== "undefined" && navigator.onLine === false && S.mode === "central") { setStatus("offline", STATUS_TEXT.offline); return; }
    inflight = true;
    const body = pending; pending = null;
    setStatus("saving", STATUS_TEXT.saving);
    try {
      if (S.mode === "central") await profileRef().set(body);
      else ls.set("dwmq.demo.profile", body);
      backoff = 2000;
      inflight = false;
      if (pending) return kick();
      setStatus("saved", STATUS_TEXT.saved + (S.mode === "demo" ? " (this browser only)" : ""));
    } catch (e) {
      inflight = false;
      if (!pending) pending = body;
      if (S.mode === "central" && transient(e)) {
        setStatus("offline", STATUS_TEXT.offline);
        retryTimer = setTimeout(kick, backoff);
        backoff = Math.min(backoff * 2, 60000);
      } else {
        S.lastError = e && e.code;
        setStatus("error", STATUS_TEXT.error);
      }
    }
  }
  function retry() { backoff = 2000; kick(); }
  const hasPending = () => !!pending || inflight;
  if (typeof window !== "undefined") {
    window.addEventListener("online", () => kick());
    window.addEventListener("offline", () => { if (pending || inflight) setStatus("offline", STATUS_TEXT.offline); });
  }

  // ---------------- assessment attempts ----------------
  // Attempt ids are created when the attempt starts, so a retried or double-clicked submission writes
  // the same document instead of a second record.
  async function saveAttempt(attempt) {
    if (S.mode === "central") {
      const ref = S.db.doc(`participants/${S.uid}/attempts/${attempt.attemptId}`);
      for (let i = 0; ; i++) {
        try {
          const existing = await ref.get();
          if (existing.exists && existing.data().submittedAt) return { duplicate: true, attempt: clone(existing.data()) };
          await ref.set(attempt);
          return { duplicate: false, attempt };
        } catch (e) {
          if (!transient(e) || i >= 4) throw e;
          setStatus("offline", STATUS_TEXT.offline);
          await sleep(1500 * (i + 1));
        }
      }
    }
    const all = ls.get("dwmq.demo.attempts") || [];
    const dup = all.find((a) => a.attemptId === attempt.attemptId);
    if (dup) return { duplicate: true, attempt: dup };
    all.push(attempt);
    ls.set("dwmq.demo.attempts", all);
    return { duplicate: false, attempt };
  }

  async function listMyAttempts() {
    if (S.mode === "central") {
      const snap = await S.db.collection(`participants/${S.uid}/attempts`).get();
      return snap.docs.map((d) => clone(d.data()));
    }
    return ls.get("dwmq.demo.attempts") || [];
  }

  // ---------------- owner functions (server rules decide; the UI gate is only a convenience) ----------------
  async function listParticipants() {
    if (S.mode !== "central") return null;
    const out = [];
    let last = null;
    for (let page = 0; page < 50; page++) {
      let q = S.db.collection("participants").orderBy("createdAt", "asc").limit(500);
      if (last) q = q.where("createdAt", ">", last);
      let snap;
      for (let i = 0; ; i++) {
        try { snap = await q.get(); break; } catch (e) { if (!transient(e) || i >= 4) throw e; await sleep(1500 * (i + 1)); }
      }
      snap.docs.forEach((d) => out.push({ uid: d.id, ...clone(d.data()) }));
      if (snap.size < 500) break;
      last = snap.docs[snap.docs.length - 1].data().createdAt;
    }
    return out;
  }
  async function listAttemptsFor(uid) {

  // Mounts the walk scene. Calls onArrive() once when the player reaches the station.
  function mountWalk(container, onArrive) {
    const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const canvas = h("canvas", { width: W, height: H, role: "img", tabindex: "0",
      "aria-label": "Top-down view of the curing department. Six curing presses; CP-04 is stopped with a flashing red lamp. A quality hold cage holds 48 tyres. The DWM station board stands beside the walkway on the right. Use arrow keys or WASD to walk, click or tap a spot to walk there, or use the Walk to the DWM station button." });
    const tip = h("div", { class: "scene-tip", role: "status", text: "Walk to the DWM STATION (right). Arrow keys / WASD, or click or tap the floor." });
    const dpad = h("div", { class: "dpad", "aria-hidden": "true" });
    const keys = new Set();
    const hold = (k) => ({ onpointerdown: (e) => { e.preventDefault(); keys.add(k); }, onpointerup: () => keys.delete(k), onpointerleave: () => keys.delete(k), onpointercancel: () => keys.delete(k) });
    dpad.append(h("span"), h("button", { ...hold("up"), "aria-label": "Up" }, "▲"), h("span"), h("button", { ...hold("left"), "aria-label": "Left" }, "◀"), h("button", { ...hold("down"), "aria-label": "Down" }, "▼"), h("button", { ...hold("right"), "aria-label": "Right" }, "▶"));
    const autoBtn = h("button", { class: "btn accent small", onclick: () => { st.target = { ...STATION }; canvas.focus(); } }, "Walk to the DWM station");
    const wrap = h("div", { class: "scene-wrap" }, canvas, h("div", { class: "scene-hud" }, h("div", { class: "row", style: "gap:8px" }, autoBtn, tip), dpad));
    container.append(wrap);

    const st = { x: START.x, y: START.y, ax: START.x - 34, ay: START.y + 6, target: null, moving: false, aMoving: false, near: false, arrived: false };
    const g = canvas.getContext("2d");
    const KEYMAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
    const kd = (e) => { const k = KEYMAP[e.code]; if (k && document.activeElement === canvas) { keys.add(k); st.target = null; e.preventDefault(); } };
    const ku = (e) => { const k = KEYMAP[e.code]; if (k) keys.delete(k); };
    window.addEventListener("keydown", kd); window.addEventListener("keyup", ku);
    canvas.addEventListener("pointerdown", (e) => {
      const r = canvas.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * W, y = ((e.clientY - r.top) / r.height) * H;
      // Clicking the board or its marker walks to the station.
      const onBoard = x > 760 && y > 270;

      canvas.focus();

    let last = performance.now(), raf;
    function step(now) {
      if (!canvas.isConnected) { window.removeEventListener("keydown", kd); window.removeEventListener("keyup", ku); return; }
      const dt = Math.min(50, now - last); last = now;
      const sp = 0.22 * dt;
      let dx = 0, dy = 0;
      if (keys.size) { if (keys.has("up")) dy -= 1; if (keys.has("down")) dy += 1; if (keys.has("left")) dx -= 1; if (keys.has("right")) dx += 1; st.target = null; }
      else if (st.target) { dx = st.target.x - st.x; dy = st.target.y - st.y; const d = Math.hypot(dx, dy); if (d < 3) { st.target = null; dx = dy = 0; } }
      const len = Math.hypot(dx, dy);
      st.moving = false;
      if (len > 0 && !st.arrived) {
        const mx = (dx / len) * Math.min(sp, st.target ? len : sp), my = (dy / len) * Math.min(sp, st.target ? len : sp);
        if (!collides(st.x + mx, st.y + my)) { st.x += mx; st.y += my; st.moving = true; }
        else if (!collides(st.x + mx, st.y)) { st.x += mx; st.moving = true; }
        else if (!collides(st.x, st.y + my)) { st.y += my; st.moving = true; }
        else st.target = null;
      }
      // Arjun follows
      const fx = st.x - 34 - st.ax, fy = st.y + 6 - st.ay, fd = Math.hypot(fx, fy);
      st.aMoving = fd > 4;
      if (st.aMoving) { const k = Math.min(1, (0.18 * dt) / fd); st.ax += fx * k; st.ay += fy * k; }
      st.near = Math.hypot(st.x - STATION.x, st.y - STATION.y) < 46;
      if (st.near && !st.arrived) {
        st.arrived = true; tip.textContent = "You have arrived at the DWM station.";
        setTimeout(onArrive, reduced ? 50 : 500);
      }
      drawScene(g, reduced ? 0 : now, st);
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
    return { destroy() { cancelAnimationFrame(raf); wrap.remove(); } };
  }

  // The board with hotspots A–H. `required` are highlighted; opening one calls onSeen(id).
  function board(mission, seen, required, onSeen) {
    const B = mission.board;
    const detail = h("div", { class: "board-detail", "aria-live": "polite" }, h("p", { class: "muted", style: "color:#9fb4d4", text: "Select a board section to open it." }));
    const grid = h("div", { class: "hotspots" });

    Object.entries(B).forEach(([k, s]) => {
      const b = h("button", { class: "hs" + (s.alert ? " alert" : "") + (seen.includes(k) ? " seen" : "") + (required.includes(k) && !seen.includes(k) ? " req" : ""),
        "aria-label": `Board section ${k}: ${s.t}. ${s.v}`, onclick: () => open(k) },
        h("span", { class: "tag", text: k }), h("span", { class: "t", text: s.t }), h("span", { class: "v", text: s.v }));
      btns[k] = b; grid.append(b);

    function open(k) {

  }

  DWM.station = { mountWalk, board };
})();

// ---- assessment.js ----
// Final certification assessment: 15 questions, attempt records, scoring and eligibility.
(function () {
  const DWM = window.DWM;
  const { h, confirmBox, toast } = DWM.ui;
  const L = DWM.logic;
  const C = DWM.CONFIG;

  const bank = () => DWM.QUESTION_BANK;
  const qById = (id) => bank().questions.find((q) => q.id === id);

  function newAttempt() {
    const qs = bank().questions.slice(0, C.questionCount);
    return {
      attemptId: L.newId("att"),
      assessmentVersion: bank().version,
      startedAt: new Date().toISOString(),
      questions: qs.map((q) => ({ id: q.id, opts: C.shuffleOptions ? L.shuffle(q.options.map((o) => o.id)) : q.options.map((o) => o.id) })),
      answers: {},
      cur: 0,
    };
  }

  // app: { profile, state, commit(meaningful), go(screen, arg) }
  function render(root, app) {
    const st = app.state;
    if (!st.assessment) { st.assessment = newAttempt(); app.commit(true); }
    const A = st.assessment;
    st.checkpoint = { screen: "assessment", label: "Certification assessment" };
    const total = A.questions.length;
    const wrap = h("div", { class: "stack" });
    root.replaceChildren(wrap);
    let submitting = false;

    function draw() {
      const item = A.questions[A.cur];
      const q = qById(item.id);
      const answered = Object.keys(A.answers).length;
      const nav = h("div", { class: "qnav", role: "navigation", "aria-label": "Questions" }, ...A.questions.map((x, i) =>
        h("button", { class: (A.answers[x.id] ? "answered " : "") + (i === A.cur ? "cur" : ""), "aria-label": `Question ${i + 1}${A.answers[x.id] ? ", answered" : ""}`, onclick: () => { A.cur = i; draw(); } }, String(i + 1))));
      const opts = h("div", { class: "options", role: "radiogroup", "aria-labelledby": "qtext" }, ...item.opts.map((oid, k) => {
        const o = q.options.find((x) => x.id === oid);
        return h("button", { class: "opt", role: "radio", "aria-checked": String(A.answers[q.id] === oid), onclick: () => {
          A.answers[q.id] = oid; app.commit(true); draw();
        } }, h("span", { class: "key", text: String.fromCharCode(65 + k) }), h("span", { text: o.t }));
      }));
      wrap.replaceChildren(
        h("div", { class: "mission-head" }, h("div", null, h("div", { class: "label", text: `Certification assessment · ${A.assessmentVersion}` }), h("h2", { text: `Question ${A.cur + 1} of ${total}` })),
          h("span", { class: "chip info", text: `${answered}/${total} answered` })),
        h("div", { class: "progress", "aria-hidden": "true" }, h("i", { style: `width:${(answered / total) * 100}%` })),
        nav,
        h("div", { class: "panel stack" }, q.scenario ? h("span", { class: "chip warn", style: "align-self:flex-start", text: "Scenario" }) : null,
          h("p", { class: "prompt", id: "qtext", text: q.text }), opts),
        h("div", { class: "row", style: "justify-content:space-between" },
          h("div", { class: "row" },
            h("button", { class: "btn", disabled: A.cur === 0, onclick: () => { A.cur--; draw(); } }, "← Previous"),
            h("button", { class: "btn", disabled: A.cur === total - 1, onclick: () => { A.cur++; draw(); } }, "Next →")),
          h("div", { class: "row" },
            h("button", { class: "btn ghost", onclick: () => app.go("hub") }, "Save and exit"),
            h("button", { class: "btn primary", onclick: submit }, "Review and submit"))),
        h("p", { class: "muted", style: "font-size:.85rem", text: `Pass mark ${C.passPercent}% (${Math.ceil((C.passPercent / 100) * total)} of ${total}). Your answers are saved as you go; you can leave and resume this attempt.` }));
    }

    async function submit() {
      if (submitting) return;
      const answered = Object.keys(A.answers).length;
      const ok = await confirmBox({ title: "Submit your assessment?", ok: "Submit",
        body: answered < total ? `You have answered ${answered} of ${total}. Unanswered questions are marked incorrect.` : `All ${total} questions answered. You can't change answers after submitting.` });
      if (!ok || submitting) return;
      submitting = true;
      wrap.querySelectorAll("button").forEach((b) => (b.disabled = true));
      try {
        const result = await finalise(app, A);
        app.go("results", result);
      } catch (e) {
        submitting = false;
        wrap.querySelectorAll("button").forEach((b) => (b.disabled = false));
        toast("Submission was not saved. Check your connection and select Review and submit again.");
      }
    }
    draw();
  }

  // Score, write the attempt record (idempotent by attemptId), then update the participant record.
  async function finalise(app, A) {
    const qs = A.questions.map((x) => qById(x.id));
    const r = L.scoreAttempt(qs, A.answers, bank().salt);
    const missionsDone = L.allMissionsDone(app.state);
    const el = L.eligibility({ scorePct: r.scorePct, passPercent: C.passPercent, missionsDone, requireAllMissions: C.requireAllMissions });
    const p = app.profile;
    const attempt = {
      attemptId: A.attemptId, employeeId: p.employeeId, employeeName: p.employeeName, email: p.email,
      assessmentVersion: A.assessmentVersion, startedAt: A.startedAt, submittedAt: new Date().toISOString(),
      scorePct: r.scorePct, correct: r.correct, incorrect: r.incorrect, total: r.total,
      passed: el.passed, eligibleAtAttempt: el.eligible, wrongAreas: r.wrongAreas, answers: { ...A.answers },
    };
    const saved = await DWM.store.saveAttempt(attempt);
    applyAttempt(app, saved.attempt);
    return { attempt: saved.attempt, perQuestion: r.perQuestion };
  }

  // Also used on load to reconcile an attempt that was written before the profile update was saved.
  function applyAttempt(app, att) {
    const p = app.profile;
    p.attemptHistory = p.attemptHistory || [];
    if (!p.attemptHistory.some((x) => x.attemptId === att.attemptId)) {
      p.attemptHistory.push({ attemptId: att.attemptId, assessmentVersion: att.assessmentVersion, startedAt: att.startedAt, submittedAt: att.submittedAt,
        scorePct: att.scorePct, correct: att.correct, incorrect: att.incorrect, passed: att.passed, eligibleAtAttempt: att.eligibleAtAttempt, wrongAreas: att.wrongAreas });
    }
    p.assessmentAttempts = p.attemptHistory.length;
    p.latestScorePct = att.scorePct;
    const anyPass = p.attemptHistory.some((x) => x.passed);
    p.assessmentStatus = att.passed ? "Passed" : anyPass ? "Passed (earlier attempt)" : "Not yet passed";
    const el = L.eligibility({ scorePct: Math.max(...p.attemptHistory.map((x) => x.scorePct)), passPercent: C.passPercent, missionsDone: L.allMissionsDone(app.state), requireAllMissions: C.requireAllMissions });
    p.eligible = el.eligible;
    p.recommended = att.wrongAreas.map((a) => DWM.LEARNING_AREAS[a].label);
    if (app.state.assessment && app.state.assessment.attemptId === att.attemptId) app.state.assessment = null;
    app.state.lastResultId = att.attemptId;
    app.state.checkpoint = { screen: "results", label: "Assessment results" };
    app.commit(true);
  }

  function renderResults(root, app, data) {
    const p = app.profile;
    const att = data && data.attempt ? data.attempt : (p.attemptHistory || []).slice(-1)[0];
    if (!att) { app.go("hub"); return; }
    const per = data && data.perQuestion;
    const passed = att.passed, eligible = p.eligible;
    const areas = (att.wrongAreas || []).map((a) => DWM.LEARNING_AREAS[a]);
    const used = p.assessmentAttempts || 0;
    const canRetake = L.attemptsAllowed(C.maxAttempts, used);
    root.replaceChildren(h("div", { class: "stack" },
      h("div", null, h("div", { class: "label", text: "Assessment results" }), h("h2", { text: passed ? "Assessment passed" : "Assessment not passed" })),
      h("div", { class: "panel scoreband" },
        h("div", null, h("div", { class: "bignum mono", text: `${att.scorePct}%` }), h("div", { class: "muted", text: `${att.correct} correct · ${att.incorrect} incorrect · of ${att.total}` })),
        h("div", { class: "stack", style: "gap:6px;flex:1;min-width:240px" },
          h("span", { class: "chip " + (passed ? "ok" : "bad"), style: "align-self:flex-start", text: passed ? `Pass (≥ ${C.passPercent}%)` : `Below ${C.passPercent}%` }),
          h("div", { class: "verdict", text: eligible ? "Eligible for Certification" : "Not Yet Eligible" }),
          h("p", { text: eligible ? "You have met the configured learning assessment criteria." : "Review the recommended learning areas and attempt the assessment again according to the assessment policy." }),
          h("p", { class: "muted", style: "font-size:.85rem", text: "This is a record of learning eligibility only. No official certificate is issued by this game." }))),
      areas.length ? h("div", { class: "panel stack" }, h("h3", { text: "Recommended learning areas" }),
        h("ul", { style: "margin:0;padding-left:20px" }, ...areas.map((a) => h("li", null, `${a.label}: `, h("button", { class: "btn small ghost", onclick: () => app.go("mission", { id: a.mission, replay: true }) }, `Replay Mission ${a.mission.slice(1)}`))))) : null,
      per ? h("div", { class: "panel stack" }, h("h3", { text: "Question feedback" }),
        ...per.map((x, i) => { const q = qById(x.id); return h("div", { class: "feedback " + (x.correct ? "ok" : "bad") }, h("b", { text: `${i + 1}. ${x.correct ? "Correct" : "Incorrect"}: ${DWM.LEARNING_AREAS[q.area].label}` }), h("span", { text: q.explain })); })) : null,
      h("div", { class: "row" },
        h("button", { class: "btn primary", onclick: () => app.go("hub") }, "Back to Mission Hub"),
        !passed && canRetake && L.allMissionsDone(app.state) ? h("button", { class: "btn", onclick: () => app.go("assessment") }, `Retake assessment (${C.maxAttempts ? `${C.maxAttempts - used} left` : "unlimited"})`) : null),
      !passed && !canRetake ? h("p", { class: "feedback note", text: `You have used all ${C.maxAttempts} attempts. Contact the TQM cell (${C.ownerContactEmail}) about next steps.` }) : null));
  }

  DWM.assessment = { render, renderResults, applyAttempt };
})();

    else go("hub");
  }

  function hub(r) {
    const st = app.state, p = app.profile;
    const moved = !st.checkpoint || st.checkpoint.screen !== "hub";
    st.checkpoint = { screen: "hub", label: "Mission Hub" };
    const done = L.allMissionsDone(st);
    const used = p.assessmentAttempts || 0;
    const canTake = done && L.attemptsAllowed(C.maxAttempts, used) && !(p.attemptHistory || []).some((a) => a.passed);
    const statusChip = (s) => ({ completed: h("span", { class: "chip ok", text: "Completed" }), in_progress: h("span", { class: "chip warn", text: "In progress" }), available: h("span", { class: "chip info", text: "Ready" }), locked: h("span", { class: "chip", text: "Locked" }) })[s];
    r.append(h("div", { class: "stack" },
      h("div", { class: "mission-head" },
        h("div", null, h("div", { class: "label", text: `${p.employeeName} · ${p.employeeId}` }), h("h2", { text: "Mission Hub" })),
        h("div", { class: "row" }, h("span", { class: "chip info", text: `${L.totalPoints(st)} points` }), Store.S.isOwner || Store.S.mode === "demo" ? h("button", { class: "btn small", onclick: () => go("admin") }, Store.S.mode === "demo" ? "Owner dashboard (demo)" : "Results dashboard") : null)),
      h("div", { class: "panel stack", style: "gap:8px" },
        h("div", { class: "row", style: "justify-content:space-between" }, h("span", { class: "label", text: "Overall progress" }), h("b", { class: "mono", text: `${p.progressPct || 0}%` })),
        h("div", { class: "progress", "aria-hidden": "true" }, h("i", { style: `width:${p.progressPct || 0}%` })),
        h("p", { class: "muted", style: "font-size:.85rem", text: `Six missions + the assessment. Started ${fmtDate(p.gameStartAt)}${p.gameCompletedAt ? " · completed " + fmtDate(p.gameCompletedAt) : ""}. Your progress saves automatically.` })),
      h("div", { class: "missions" }, ...DWM.MISSIONS.map((m) => {
        const ms = st.missions[m.id];
        const label = ms.status === "completed" ? "Replay" : ms.status === "in_progress" ? "Resume mission" : "Start mission";
        return h("article", { class: "mcard", "data-status": ms.status },
          h("header", null, h("span", { class: "num", text: String(m.n).padStart(2, "0") }), h("div", { style: "min-width:0" }, h("div", { class: "label phase", text: m.phase }), h("h3", { text: m.title }))),
          h("p", { text: m.summary }),
          h("div", { class: "row", style: "justify-content:space-between" }, statusChip(ms.status),
            ms.status === "locked" ? h("span", { class: "muted", style: "font-size:.82rem", text: `Complete Mission ${m.n - 1} first` }) :
              h("button", { class: "btn small " + (ms.status === "completed" ? "" : "primary"), onclick: () => go("mission", { id: m.id, replay: ms.status === "completed" }) }, label)));
      })),
      h("article", { class: "mcard" },
        h("header", null, h("span", { class: "num", text: "✓" }), h("div", null, h("div", { class: "label phase", text: "Certification" }), h("h3", { text: "Final assessment · 15 questions" }))),
        h("p", { text: done ? `Pass mark ${C.passPercent}%. ${C.maxAttempts ? `Attempts used: ${used} of ${C.maxAttempts}.` : `Attempts used: ${used}.`}` : "Unlocks when all six missions are complete." }),
        h("div", { class: "row" },
          p.assessmentAttempts ? h("span", { class: "chip " + (p.eligible ? "ok" : "warn"), text: p.eligible ? "Eligible for Certification" : "Not Yet Eligible" }) : null,
          p.assessmentAttempts ? h("span", { class: "chip", text: `Latest ${p.latestScorePct}%` }) : null,
          canTake ? h("button", { class: "btn primary small", onclick: () => go("assessment") }, st.assessment ? "Resume assessment" : used ? "Retake assessment" : "Start assessment") : null,
          used ? h("button", { class: "btn small", onclick: () => go("results") }, "View latest result") : null)),
      footer()));
    if (moved) app.commit(false);
  }

  // ---------------- mission controller ----------------
  function missionScreen(r, arg) {
    const m = DWM.MISSION_BY_ID[arg.id];
    const real = app.state.missions[m.id];
    if (real.status === "locked") { go("hub"); return; }
    const replay = !!arg.replay && real.status === "completed";
    const ms = replay ? { status: "in_progress", step: 0, answers: {}, tries: {}, points: 0, seen: [] } : real;
    if (!replay && real.status === "available") { real.status = "in_progress"; real.startedAt = new Date().toISOString(); }
    ms.seen = ms.seen || [];
    const save = (meaningful) => { if (!replay) app.commit(meaningful); };

    const container = h("div", { class: "stack" });
    r.append(container);
    let walker = null;

    function setCheckpoint() {
      if (replay) return;
      const s = m.steps[ms.step];
      app.state.checkpoint = { screen: "mission", mission: m.id, step: ms.step, label: `Mission ${m.n}: ${m.title}${s && s.title ? " · " + s.title : ""}` };
    }

    function draw() {
      if (walker) { walker.destroy(); walker = null; }
      ms.step = Math.min(ms.step, m.steps.length - 1);
      const step = m.steps[ms.step];
      setCheckpoint();
      const head = h("div", { class: "mission-head" },
        h("div", null, h("div", { class: "label", text: `Mission ${m.n} · ${m.phase}${replay ? " · REPLAY (saved progress unchanged)" : ""}` }), h("h2", { text: m.title })),
        h("div", { class: "row" }, h("div", { class: "steps", "aria-label": `Step ${ms.step + 1} of ${m.steps.length}` }, ...m.steps.map((_, i) => h("i", { class: i < ms.step ? "done" : i === ms.step ? "cur" : "" }))),
          h("span", { class: "chip info", text: `${ms.points || 0} pts` })));
      const body = h("div", { class: "stack" });
      container.replaceChildren(head, body);

      const ctx = {
        mission: m, step, ms,
        check(answer, correct) {
          ms.tries[step.id] = (ms.tries[step.id] || 0) + 1;
          ms.answers[step.id] = { ...answer, correct, at: new Date().toISOString() };
          if (correct) ms.points = (ms.points || 0) + DWM.missions.pointsFor(ms.tries[step.id]);
          save(true);
        },
        done() {
          if (ms.step >= m.steps.length - 1) return finish();
          ms.step++; save(true); draw(); focusMain();
        },
      };

      if (m.station) return drawStation(body, step, ctx);
      body.append(DWM.missions.renderStep(ctx));
    }

    function drawStation(body, step, ctx) {
      const scored = m.steps.filter((s) => s.title);
      const checklist = h("ol", { class: "checklist", "aria-label": "Station review sequence" }, ...scored.map((s) => {
        const i = m.steps.indexOf(s);
        return h("li", { class: i < ms.step ? "done" : i === ms.step ? "cur" : "", text: `${scored.indexOf(s) + 1}. ${s.title}` });
      }));
      if (step.type === "walk" && !ms.arrived) {
        body.append(dialogue(step.speaker, step.say));
        const scene = h("div");
        body.append(scene);
        walker = DWM.station.mountWalk(scene, () => { ms.arrived = true; save(true); draw(); });
        return;
      }
      if (step.type === "walk") {
        body.append(dialogue(step.arrive.speaker, step.arrive.say), h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => ctx.done() }, "Open the board →")));
        return;
      }
      const req = step.requires || [];
      const qArea = h("div", { class: "stack" });
      const brd = DWM.station.board(m, ms.seen, req, (k) => {
        if (!ms.seen.includes(k)) { ms.seen.push(k); save(true); }
        drawQuestion();
      });
      function drawQuestion() {
        const missing = req.filter((k) => !ms.seen.includes(k));
        if (missing.length) {
          qArea.replaceChildren(dialogue(step.speaker, `Open board section${missing.length > 1 ? "s" : ""} ${missing.join(" and ")} (highlighted) to review it.`));
          return;
        }
        if (!qArea.dataset.ready) { qArea.dataset.ready = "1"; qArea.replaceChildren(DWM.missions.renderStep(ctx)); }
      }
      body.append(brd.el, h("div", { class: "station-grid" },
        h("div", { class: "panel flat" }, h("div", { class: "label", text: "Review sequence" }), checklist), h("div", { class: "panel" }, qArea)));
      drawQuestion();
      // Opening the most relevant section first keeps the board in context on small screens.
      if (req.length && req.every((k) => ms.seen.includes(k))) brd.open(req[req.length - 1]);
    }

    function finish() {
      if (!replay) {
        real.status = "completed"; real.completedAt = real.completedAt || new Date().toISOString(); real.step = m.steps.length - 1;
        app.profile.missionLog = app.profile.missionLog || [];
        if (!app.profile.missionLog.some((x) => x.mission === m.id)) app.profile.missionLog.push({ mission: m.id, completedAt: real.completedAt, points: real.points });
        L.unlockMissions(app.state);
        const nx = DWM.MISSIONS[m.n];
        app.state.checkpoint = nx ? { screen: "mission", mission: nx.id, step: 0, label: `Mission ${nx.n}: ${nx.title}` } : { screen: "assessment", label: "Certification assessment" };
        app.commit(true);
      }
      const next = DWM.MISSIONS[m.n];
      container.replaceChildren(h("div", { class: "panel stack" },
        h("div", { class: "label", text: replay ? "Replay complete" : `Mission ${m.n} complete` }), h("h2", { text: m.title }),
        h("p", { text: replay ? "Replay finished. Your saved progress and points are unchanged." : `You earned ${ms.points} points. Progress saved.` }),
        h("div", { class: "row" },
          next && !replay ? h("button", { class: "btn primary", onclick: () => go("mission", { id: next.id }) }, `Start Mission ${next.n} →`) : null,
          !next && !replay ? h("button", { class: "btn primary", onclick: () => go("assessment") }, "Go to the assessment →") : null,
          h("button", { class: "btn", onclick: () => go("hub") }, "Mission Hub"))));
      focusMain();
    }

    if (!replay) app.commit(true);
    draw();
  }

  function assessmentScreen(r) {
    const p = app.profile;
    if (!L.allMissionsDone(app.state)) { toast("Complete all six missions to unlock the assessment."); return go("hub"); }
    if (!app.state.assessment && (!L.attemptsAllowed(C.maxAttempts, p.assessmentAttempts || 0) || (p.attemptHistory || []).some((a) => a.passed))) return go("results");
    DWM.assessment.render(r, app);
  }
  function results(r, data) { DWM.assessment.renderResults(r, app, data); }
  function admin(r) { DWM.admin.render(r, app); }
  function errorScreen(r, msg) {
    r.append(h("div", { class: "panel stack", style: "max-width:600px" }, h("h2", { text: "Can't load your progress" }), h("p", { text: msg }), h("button", { class: "btn primary", onclick: () => boot() }, "Try again")));
  }

  // ---------------- boot ----------------
  async function boot() {
    root().replaceChildren(h("p", { class: "muted", text: "Loading DWM QUEST…" }));
    if (!document.querySelector(".topbar")) topbar();
    await Store.init();
    if (!document.querySelector(".mode-banner")) modeBanner();
    let prof;
    try { prof = await Store.loadProfile(); }
    catch { return go("error", "We couldn't reach the results store, so your saved progress isn't shown yet. Nothing has been lost. Check your connection and try again."); }
    if (prof) {
      app.profile = prof;
      app.state = L.migrateState(prof.state);
      // Reconcile an attempt that was saved before the profile update completed.
      if (app.state.assessment) {
        try {
          const mine = await Store.listMyAttempts();
          const hit = mine.find((a) => a.attemptId === app.state.assessment.attemptId && a.submittedAt);
          if (hit) DWM.assessment.applyAttempt(app, hit);
        } catch { /* keep in-progress attempt */ }
      }
      go("resume");
    } else go("welcome");
  }

  window.addEventListener("beforeunload", (e) => { if (Store.hasPending()) { e.preventDefault(); e.returnValue = ""; } });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  DWM.app = app;
})();

</script>

</body>
</html>
